# Full NVIDIA microphone path:
#   Blue Snowball + playback reference -> AEC -> dereverb + denoiser -> source

context.properties = {
    log.level = 2
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Zer0 NVIDIA Maxine Full Microphone"
            media.name = "Zer0 NVIDIA Maxine Full Microphone"
            filter.graph = {
                nodes = [
                    {
                        type = ladspa
                        name = aec
                        plugin = "maxine_aec_ladspa"
                        label = "zer0-maxine-aec"
                        control = {
                            "Intensity" = 100.0
                        }
                    }
                    {
                        type = ladspa
                        name = denoise
                        plugin = "rnnoise_ladspa"
                        label = "nt-filter"
                        control = {
                            "VAD" = 0.0
                            "Intensity %%" = 100.0
                        }
                    }
                ]
                links = [
                    { output = "aec:Output" input = "denoise:Input" }
                ]
                inputs = [ "aec:Near End" "aec:Far End" ]
                outputs = [ "denoise:Output" ]
            }
            capture.props = {
                node.name = "capture.zer0_maxine_full"
                node.passive = true
                node.autoconnect = false
                audio.rate = 48000
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name = "zer0_maxine_full"
                node.description = "Zer0 NVIDIA Maxine Full Microphone"
                media.class = Audio/Source
                audio.rate = 48000
                resample.disable = false
                audio.channels = 1
                audio.position = [ MONO ]
            }
        }
    }
]
