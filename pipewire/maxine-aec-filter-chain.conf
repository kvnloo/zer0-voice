# NVIDIA Maxine AEC virtual source.
#
# Input FL: near-end Blue Snowball microphone.
# Input FR: far-end Aural Evolution playback monitor.
# Output: echo-cancelled mono microphone.
#
# The two capture ports are linked explicitly by the service launcher so the
# session manager cannot accidentally swap near and far ends.

context.properties = {
    log.level = 2
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Zer0 NVIDIA Maxine Echo-Cancelled Microphone"
            media.name = "Zer0 NVIDIA Maxine Echo-Cancelled Microphone"
            filter.graph = {
                nodes = [
                    {
                        type = ladspa
                        name = aec
                        plugin = "maxine_aec_ladspa"
                        label = "zer0-maxine-aec"
                        control = {
                            "Intensity" = 100.0
                        }
                    }
                ]
                inputs = [ "aec:Near End" "aec:Far End" ]
                outputs = [ "aec:Output" ]
            }
            capture.props = {
                node.name = "capture.zer0_maxine_aec"
                node.passive = true
                node.autoconnect = false
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name = "zer0_maxine_aec"
                node.description = "Zer0 NVIDIA Maxine Echo-Cancelled Microphone"
                media.class = Audio/Source
                audio.channels = 1
                audio.position = [ MONO ]
            }
        }
    }
]
