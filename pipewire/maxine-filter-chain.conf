# Native PipeWire 1.6 virtual microphone backed by the local NVIDIA Maxine
# dereverb+denoiser LADSPA bridge. The physical Blue Snowball remains the
# system default; consumers opt in to `zer0_maxine_mic`.

context.properties = {
    log.level = 2
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Zer0 NVIDIA Maxine Microphone"
            media.name = "Zer0 NVIDIA Maxine Microphone"
            filter.graph = {
                nodes = [
                    {
                        type = ladspa
                        name = maxine
                        plugin = "rnnoise_ladspa"
                        label = "nt-filter"
                        control = {
                            "VAD" = 0.0
                            "Intensity %%" = 100.0
                        }
                    }
                ]
            }
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name = "capture.zer0_maxine_mic"
                node.passive = true
                target.object = "alsa_input.usb-BLUE_MICROPHONE_Blue_Snowball_797_2020_11_17_99419-00.mono-fallback"
            }
            playback.props = {
                node.name = "zer0_maxine_mic"
                node.description = "Zer0 NVIDIA Maxine Microphone"
                media.class = Audio/Source
            }
        }
    }
]
